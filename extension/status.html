<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>論文をKindleへ · 処理状況</title><link rel="stylesheet" href="ui.css"><main><div class="eyebrow">PAPER → KINDLE</div><h1>論文を、手元のKindleへ。</h1><section class="card"><div id="stage" class="status-label">準備</div><p id="message" role="status">まだ処理はありません。論文ページで拡張のアイコンを押してください。</p><p id="filename" class="muted"></p><div class="row"><button id="download" hidden>PDFを保存</button><button id="amazon" class="secondary" hidden>Amazonの送信画面</button><button id="source" class="secondary" hidden>論文に戻る</button><button id="cancel" class="secondary" hidden>停止</button></div><p id="feedback" role="status"></p></section><p class="notice">「Amazon受付済み」は、Amazonが処理を受け付けた状態です。Kindle端末へのダウンロード完了を表すものではありません。送信後に止まった場合は、重複送信を防ぐため自動再送しません。</p><div class="row"><a class="button secondary" href="options.html">設定</a><button id="clear" class="secondary">保存PDF・履歴を消去</button></div><footer>翻訳と画像の読み込みには時間がかかる場合があります。処理中は元のタブを閉じたり、別のページへ移動しないでください。未翻訳なら「論文に戻る」からChromeの翻訳を実行できます。</footer></main><script type="module" src="status.js"></script></html>
